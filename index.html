<!doctype html><html lang="ja"><head>

<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16182e"><title>Neuro Quest v0.5</title><style>
*{box-sizing:border-box}body{margin:0;background:#101426;color:#eee9fa;font:16px system-ui,-apple-system,sans-serif}main{max-width:570px;margin:auto;padding:18px 14px 45px}.hero{background:linear-gradient(145deg,#262448,#171a32);border:1px solid #554a79;border-radius:20px;text-align:center;padding:23px 12px}h1{font-size:27px;margin:5px}h2{font-size:17px;margin:0 0 12px}.sub{color:#bcb4d7;font-size:13px}.panel{border:1px solid #393855;border-radius:15px;background:#1b2038;padding:15px;margin-top:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.mode,.answer,.orb{background:#292f4c;color:#f2ebff;border:1px solid #555578;border-radius:12px;padding:13px;min-height:55px;font:inherit;touch-action:manipulation}.mode{text-align:left;font-size:14px;min-height:72px}.mode.selected{outline:2px solid #ad92f0;background:#40365f}.mode small{display:block;color:#c5b9d9;margin-top:4px}.action{width:100%;border:0;border-radius:12px;padding:13px;background:#a58be9;color:#16152c;font-weight:750;font-size:16px;margin-top:12px}.action:disabled{opacity:.45}.orb{font-size:34px;height:94px}.orb.lit{background:#d8bd76;color:#251d39;box-shadow:0 0 22px #d8bd76;transform:scale(1.03)}button:disabled{opacity:.6}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #f4d786;outline-offset:2px}#question{font-size:25px;text-align:center;font-weight:750;padding:12px;min-height:55px}#message{text-align:center;min-height:55px;padding:12px;background:#272d49;border-radius:10px;font-size:14px}#answers{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}#orbs{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}.hide{display:none!important}.stat{font-size:12px;background:#282d49;padding:9px;border-radius:9px}input[type=range]{width:135px;accent-color:#b89cf0}.toggle{border:1px solid #70648e;background:#393455;color:white;border-radius:9px;padding:9px 12px}#bar{height:8px;border-radius:9px;background:#3d3b57;overflow:hidden;margin-top:10px}#fill{height:100%;width:0;background:#b79bf1}#status{font-size:12px;color:#c5b9d9;margin-top:8px}footer{font-size:11px;color:#aba5c1;margin-top:16px;line-height:1.7}
</style></head><body><main><header class="hero"><div class="sub">FANTASY BRAIN TRAINING</div><h1>🔮 Neuro Quest</h1><div class="sub">五つの試練と、静かな魔法の旋律</div></header>
<section class="panel"><div class="row"><strong id="level">🧙 Lv.1 冒険者</strong><span id="xp">0 / 100 XP</span></div><div id="bar"><div id="fill"></div></div><div id="status">正解を重ねて経験値を獲得しよう</div></section>
<section class="panel"><h2>🎵 音の設定</h2><div class="row"><span>BGM</span><button id="music" class="toggle" aria-pressed="false">♪ 音楽をON</button></div><div class="row" style="margin-top:10px"><label for="bgm">BGM音量</label><input id="bgm" type="range" min="0" max="100" value="25"></div><div class="row" style="margin-top:10px"><label for="sfx">効果音量</label><input id="sfx" type="range" min="0" max="100" value="45"></div><div class="sub" style="margin-top:8px">静かなオリジナルのピアノ風旋律とアンビエント。音はタップ操作後に再生されます。</div></section>
<section class="panel"><h2>⚔️ 試練を選ぶ</h2><div id="modes" class="grid"><button class="mode selected" data-mode="memory">🔮 記憶の神殿<small>記憶力</small></button><button class="mode" data-mode="attention">🌲 探索の森<small>注意力</small></button><button class="mode" data-mode="speed">⚡ 瞬速の塔<small>判断速度</small></button><button class="mode" data-mode="logic">📜 賢者の試練<small>論理的思考</small></button><button class="mode" data-mode="flex">🌀 変幻の迷宮<small>認知的柔軟性</small></button></div></section>
<section class="panel"><div class="row"><h2 id="title">🔮 記憶の神殿</h2><span id="round" class="sub">ラウンド 0</span></div><div id="message" role="status" aria-live="polite">光る紋章の順番を覚えてください。</div><div id="question" class="hide"></div><div id="orbs"><button class="orb" data-orb="0">🔥</button><button class="orb" data-orb="1">💧</button><button class="orb" data-orb="2">🌿</button><button class="orb" data-orb="3">⚡</button></div><div id="answers" class="hide"></div><button id="start" class="action">冒険を始める</button></section>
<section class="panel"><h2>📊 冒険の記録</h2><div id="stats" class="grid"></div><button id="reset" class="toggle" style="margin-top:12px">記録をリセット</button><div id="saveinfo" class="sub" style="margin-top:8px"></div></section><footer>ゲーム内の正答率や経験値は、医学的な認知機能の測定・診断を意味しません。音源はこのアプリ専用に生成したオリジナルの電子音です。音声は外部サーバーに送信しません。</footer></main>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],rnd=n=>Math.floor(Math.random()*n),pause=t=>new Promise(r=>setTimeout(r,t));const names={memory:'🔮 記憶の神殿',attention:'🌲 探索の森',speed:'⚡ 瞬速の塔',logic:'📜 賢者の試練',flex:'🌀 変幻の迷宮'};const initial=()=>({xp:0,games:0,correct:0,stats:Object.fromEntries(Object.keys(names).map(k=>[k,{played:0,correct:0}]))});let data=initial(),storage=true;try{let saved=JSON.parse(localStorage.getItem('neuroquest_v05'));if(saved&&saved.stats&&Object.keys(names).every(k=>saved.stats[k]))data=saved}catch(e){storage=false}let mode='memory',round=0,phase='idle',seq=[],pos=0,token=0,expected='',ctx=null,musicOn=false,musicTimer=null,nextMusic=0;const orbs=$$('#orbs button');
function save(){try{localStorage.setItem('neuroquest_v05',JSON.stringify(data));storage=true}catch(e){storage=false}$('#saveinfo').textContent=storage?'記録はこのブラウザ内に保存されます。':'この環境では記録を永続保存できません。'}
function draw(){let lv=1+Math.floor(data.xp/100);$('#level').textContent='🧙 Lv.'+lv+' 冒険者';$('#xp').textContent=(data.xp%100)+' / 100 XP';$('#fill').style.width=(data.xp%100)+'%';$('#round').textContent='ラウンド '+round;$('#stats').replaceChildren();for(const [k,v] of Object.entries(data.stats)){let d=document.createElement('div');d.className='stat';d.textContent=names[k]+'：'+v.correct+'/'+v.played+' 正解';$('#stats').appendChild(d)}save()}
function msg(t){$('#message').textContent=t}function setPhase(p){phase=p;orbs.forEach(b=>b.disabled=p!=='input');$$('#answers button').forEach(b=>b.disabled=p!=='input')}
function soundContext(){try{if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}catch(e){return null}}
function note(freq,when,duration,volume,kind='piano'){const ac=soundContext();if(!ac||volume<=0)return;const osc=ac.createOscillator(),gain=ac.createGain(),filter=ac.createBiquadFilter();osc.type=kind==='pad'?'sine':'triangle';osc.frequency.setValueAtTime(freq,when);filter.type='lowpass';filter.frequency.value=kind==='pad'?950:2100;let attack=kind==='pad'?.7:.015,release=kind==='pad'?1.3:.55;gain.gain.setValueAtTime(.0001,when);gain.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),when+attack);gain.gain.exponentialRampToValueAtTime(.0001,when+duration+release);osc.connect(filter);filter.connect(gain);gain.connect(ac.destination);osc.start(when);osc.stop(when+duration+release+.05)}
function effect(type){let ac=soundContext();if(!ac)return;let v=(+$('#sfx').value/100)*.11,t=ac.currentTime+.01;if(type==='ok'){note(659,t,.11,v);note(988,t+.12,.19,v*.8)}else if(type==='bad'){note(261,t,.22,v*.5);note(220,t+.13,.25,v*.35)}else if(type==='level'){[523,659,784,1047].forEach((f,i)=>note(f,t+i*.13,.24,v))}else note(520,t,.09,v*.3)}
// Original 16-step ambient motif: D minor pentatonic, slow and deliberately sparse.
const melody=[293.66,0,349.23,0,440,0,349.23,0,293.66,0,261.63,0,220,0,261.63,0];let step=0;function scheduleMusic(){if(!musicOn||!ctx)return;let now=ctx.currentTime;while(nextMusic<now+.5){let v=(+$('#bgm').value/100)*.035;if(melody[step%16])note(melody[step%16],nextMusic,.36,v);if(step%8===0){note(step%16===0?146.83:174.61,nextMusic,3.1,v*.45,'pad');note(step%16===0?220:261.63,nextMusic,3.1,v*.22,'pad')}step++;nextMusic+=.62}}function stopMusic(){musicOn=false;clearInterval(musicTimer);musicTimer=null;$('#music').textContent='♪ 音楽をON';$('#music').setAttribute('aria-pressed','false')}
$('#music').onclick=()=>{if(musicOn){stopMusic();return}let ac=soundContext();if(!ac){msg('このブラウザでは音声を利用できません');return}musicOn=true;step=0;nextMusic=ac.currentTime+.05;$('#music').textContent='♫ 音楽をOFF';$('#music').setAttribute('aria-pressed','true');scheduleMusic();musicTimer=setInterval(scheduleMusic,250)};document.addEventListener('visibilitychange',()=>{if(document.hidden)stopMusic()});
function choose(m){token++;mode=m;round=0;seq=[];setPhase('idle');$$('.mode').forEach(b=>b.classList.toggle('selected',b.dataset.mode===m));$('#title').textContent=names[m];$('#question').classList.add('hide');$('#answers').classList.add('hide');$('#orbs').classList.toggle('hide',m!=='memory');$('#start').classList.remove('hide');$('#start').textContent='冒険を始める';msg('準備ができたら冒険を始めましょう');draw()}
function award(ok){data.games++;data.stats[mode].played++;if(ok){data.correct++;data.stats[mode].correct++;let prev=Math.floor(data.xp/100);data.xp+=20;effect(Math.floor(data.xp/100)>prev?'level':'ok')}else effect('bad');draw()}
function finish(ok,answer){if(phase==='done')return;setPhase('done');award(ok);msg(ok?'✨ 正解！ +20 XP':'💔 不正解。正解：'+answer);$('#start').classList.remove('hide');$('#start').textContent=ok?'次のラウンドへ':'再挑戦';if(mode==='memory'&&!ok)seq=[]}
function options(items,answer){const box=$('#answers');box.replaceChildren();box.className='';box.id='answers';box.style.display='grid';box.style.gridTemplateColumns='repeat(2,1fr)';box.style.gap='9px';items.sort(()=>Math.random()-.5).forEach(item=>{let b=document.createElement('button');b.className='answer';b.textContent=item.label;b.onclick=()=>{if(phase==='input')finish(item.value===answer,expected)};box.appendChild(b)});setPhase('input')}
async function memory(){let id=token;seq.push(rnd(4));setPhase('show');msg('👁️ 光る順番を覚えてください');await pause(550);for(let i of seq){if(id!==token)return;orbs[i].classList.add('lit');await pause(460);orbs[i].classList.remove('lit');await pause(220)}if(id!==token)return;pos=0;setPhase('input');msg('同じ順番で紋章をタップ')}
orbs.forEach((b,i)=>b.onclick=async()=>{if(mode!=='memory'||phase!=='input')return;let id=token;setPhase('check');b.classList.add('lit');effect('tap');await pause(160);b.classList.remove('lit');if(id!==token)return;if(i!==seq[pos]){finish(false,['🔥','💧','🌿','⚡'][seq[pos]]);return}pos++;if(pos===seq.length)finish(true,'');else{setPhase('input');msg('残り '+(seq.length-pos)+' 個')}});
function attention(){let symbols=['◆','●','▲','■','★','✦'];let target=symbols[rnd(symbols.length)],others=symbols.filter(s=>s!==target),arr=Array.from({length:24},()=>others[rnd(others.length)]),slot=rnd(24);arr[slot]=target;$('#question').classList.remove('hide');$('#question').textContent='探す記号：'+target;msg('指定された記号を探してタップ');let box=$('#answers');box.replaceChildren();box.classList.remove('hide');box.style.display='grid';box.style.gridTemplateColumns='repeat(6,1fr)';box.style.gap='4px';expected=target;arr.forEach((s,i)=>{let b=document.createElement('button');b.className='answer';b.style.padding='9px 0';b.style.minHeight='45px';b.textContent=s;b.onclick=()=>{if(phase==='input')finish(i===slot,target)};box.appendChild(b)});setPhase('input')}
function speed(){let names=['赤','青','緑','黄'],colors=['#fa666c','#62a4ff','#4ed5a1','#f0c45c'],w=rnd(4),c=rnd(4),same=w===c;$('#question').classList.remove('hide');$('#question').textContent=names[w];$('#question').style.color=colors[c];msg('文字の意味と表示色は一致する？');expected=same?'一致':'不一致';options([{label:'一致する',value:true},{label:'一致しない',value:false}],same)}
function logic(){let a=1+rnd(7),d=1+rnd(5),kind=rnd(3),arr,ans;if(kind===0){arr=[0,1,2,3].map(i=>a+d*i);ans=a+d*4}else if(kind===1){arr=[0,1,2,3].map(i=>a*2**i);ans=a*16}else{arr=[0,1,2,3].map(i=>a+d*i*i);ans=a+d*16}$('#question').classList.remove('hide');$('#question').style.color='';$('#question').textContent=arr.join(' → ')+' → ?';msg('次に入る数字を選ぼう');expected=String(ans);let vals=[ans,ans+d,ans-d,ans+2*d];options(vals.map(n=>({label:String(n),value:n})),ans)}
function flex(){let a=1+rnd(9),b=1+rnd(9);while(a===b)b=1+rnd(9);let large=rnd(2)===0,ans=large?Math.max(a,b):Math.min(a,b);$('#question').classList.remove('hide');$('#question').style.color='';$('#question').textContent=a+' VS '+b;msg(large?'🟣 大きい数字を選ぶ':'🟠 小さい数字を選ぶ');expected=String(ans);options([a,b].map(n=>({label:String(n),value:n})),ans)}
function start(){token++;round++;$('#start').classList.add('hide');$('#question').style.color='';$('#question').classList.add('hide');$('#answers').classList.add('hide');$('#answers').style.display='none';draw();({memory,attention,speed,logic,flex})[mode]()}
$$('.mode').forEach(b=>b.onclick=()=>choose(b.dataset.mode));$('#start').onclick=start;$('#reset').onclick=()=>{if(!confirm('冒険の記録をすべて削除しますか？'))return;data=initial();choose('memory')};choose('memory');
})();
</script></body></html>
